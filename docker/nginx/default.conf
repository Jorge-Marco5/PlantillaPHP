server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # Logs en contenedor
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Bloquear acceso directo a directorios internos (equivalente a .htaccess)
    location ~ ^/(src|var|db|routes|views|vendor|docker)(/|$) {
        deny all;
        return 403;
    }

    # Bloquear acceso a archivos sensibles y ocultos (.env, .git, composer.*, etc.)
    location ~ /(\.|\bcomposer\.(json|lock)\b|\bREADME\.md\b|\bDockerfile\b|\bdocker-compose\.yml\b) {
        deny all;
        return 403;
    }

    # Servir archivos estáticos en /public directamente
    location /public/ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Redirigir todas las peticiones al front controller (index.php)
    location / {
        try_files $uri /index.php?$query_string;
    }

    # Procesar PHP mediante PHP-FPM en el servicio 'app'
    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
    }

    # Bloquear ejecución directa de cualquier otro archivo .php
    location ~ \.php$ {
        return 404;
    }
}
