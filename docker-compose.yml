services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plantillaphp_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - plantillaphp_network

  nginx:
    image: nginx:alpine
    container_name: plantillaphp_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - plantillaphp_network

  db:
    image: mysql:8.4
    container_name: plantillaphp_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-mydatabase}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - plantillaphp_network

networks:
  plantillaphp_network:
    driver: bridge

volumes:
  db_data:
